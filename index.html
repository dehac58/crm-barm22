<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="design.css" rel="stylesheet" type="text/css" />
    <title>Kundentabelle</title>
</head>


<body>

    <!-- Tabelle mit API-Daten -->
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Kundentabelle</h1>
        <table class="table table-hover table-bordered">
            <thead id="table-head" class="table-dark">
            </thead>
            <tbody id="table-body">
                <!-- Dynamisch generierte Daten -->
            </tbody>
        </table>
    </div>

    <!-- Detail-Pop-up Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalLabel">Details</h5>
                    <!-- Nur das X zum Schließen -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>E-Mail:</strong> <span id="modal-email"></span></p>
                    <p><strong>Telefonnummer:</strong> <span id="modal-phone"></span></p>

                    <!-- Editieren der Daten -->
                    <div id="edit-section" class="mt-3" style="display: none;">
                        <h4>Bearbeite die Daten:</h6>
                            <form id="edit-form">
                                <div class="mb-3">
                                    <label for="edit-companyname" class="form-label">Firmenname</label>
                                    <input type="text" class="form-control" id="edit-companyname">
                                </div>
                                <div class="mb-3">
                                    <label for="edit-email" class="form-label">E-Mail</label>
                                    <input type="email" class="form-control" id="edit-email">
                                </div>
                                <div class="mb-3">
                                    <label for="edit-phone" class="form-label">Telefonnummer</label>
                                    <input type="text" class="form-control" id="edit-phone">
                                </div>
                            </form>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="delete-button">Löschen</button>
                    <button type="button" class="btn btn-primary" id="edit-button">Bearbeiten</button>
                    <button type="button" class="btn btn-success" id="save-button"
                        style="display: none;">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Button -->
    <button type="button" class="btn btn-primary buttonaddnewcustomer" data-bs-toggle="modal" data-bs-target="#buttonaddnewcustomer">
        <i class="bi bi-plus"></i>
    </button>


    <!-- Floating Button -->
    <div class="modal fade" id="buttonaddnewcustomer" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" >
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Kunden Hinzufügen</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body" id="modal-body">
                    
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
                    <button type="button" id="submitBtn" class="btn btn-primary" data-bs-dismiss="modal">Hinzufügen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="js/main.js"></script>
    <script src="js/m_data_render.js"></script>
    <script src="js/m_data_get.js"></script>
    <script src="js/m_data_post.js"></script>
    <script src="js/m_data_put.js"></script>
    <script src="js/m_data_delete.js"></script>
</body>

</html>
